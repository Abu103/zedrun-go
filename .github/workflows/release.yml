name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-latest }
          - { os: darwin, arch: amd64, runner: macos-latest }
          - { os: darwin, arch: arm64, runner: macos-latest }
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: windows, arch: arm64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the floor from go.mod so the release build can never drift out
          # of sync with the module. It was pinned to "1.22" while go.mod
          # required 1.24, which would have failed the first tagged release.
          go-version-file: go.mod
      - name: Build static binary
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o "dist/zedrun-go-$GOOS-$GOARCH$ext" ./cmd/zedrun
      - uses: actions/upload-artifact@v4
        with:
          name: zedrun-go-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum zedrun-go-* > checksums.txt
          cat checksums.txt
      - name: Smoke-test the linux binary
        run: |
          chmod +x dist/zedrun-go-linux-amd64
          ./dist/zedrun-go-linux-amd64 --version
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
